name: "Terraform Apply (Merge to Main)"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "*.tf"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          RAW_RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo "$RAW_RESPONSE" | jq -r '.value')
          node -e '
            const jwt = process.argv[1];
            const [h, p] = jwt.split(".").slice(0, 2).map(s => JSON.parse(Buffer.from(s, "base64").toString()));
            console.log("=== OIDC JWT Header ===");
            console.log(JSON.stringify(h, null, 2));
            console.log("=== OIDC JWT Payload (Claims) ===");
            console.log(JSON.stringify(p, null, 2));
          ' "$JWT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure AWS Credentials via OIDC (STS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::314900493735:role/GitHubActions-TerraformDeployer
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: github-actions-tf-apply-${{ github.sha }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        id: init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Apply
        id: apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -no-color